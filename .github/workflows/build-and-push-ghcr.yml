name: Build and push image

# Builds the chatbox container image and publishes it to GHCR.
#
# This job runs on a GitHub-hosted runner (ubuntu-latest). It deliberately does
# NOT use the self-hosted `contabo-builder` runner: that box is oversubscribed
# (6 vCPU) and hosts other lanes' builds, so the compile belongs on a free
# runner. Nothing here touches the production VPS.
#
# Production (Coolify app jr9thwkx7rg4jxnmg4wvp0qw) is a pull-only
# `dockerimage` app, so production only ever PULLS the image produced here —
# it never compiles.
#
# Tags published per commit:
#   ghcr.io/maxpetrusenko/chatbox:<bare commit sha>
#   ghcr.io/maxpetrusenko/chatbox:latest
#
# The BARE commit sha tag is the one convention: Coolify's
# docker_registry_image_tag is set to exactly `${{ github.sha }}`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chatbox-image-build
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/maxpetrusenko/chatbox

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=chatbox
          cache-to: type=gha,mode=max,scope=chatbox
