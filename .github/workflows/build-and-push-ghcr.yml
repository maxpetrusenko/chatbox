name: Build and push image

# Builds the chatbox container image and publishes it to GHCR.
#
# IMPORTANT: this job runs on the self-hosted builder box (label
# `contabo-builder`). It must NEVER run on the production VPS: the Coolify app
# that serves chatbox.maxpetrusenko.com is a pull-only `dockerimage` app, so
# production only ever pulls the image produced here.
#
# Tags published per commit:
#   ghcr.io/maxpetrusenko/chatbox:<bare commit sha>
#   ghcr.io/maxpetrusenko/chatbox:latest
#
# The bare commit sha tag is what Coolify's docker_registry_image_tag is set to.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chatbox-image-build
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/maxpetrusenko/chatbox

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: [self-hosted, contabo-builder]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=chatbox
          cache-to: type=gha,mode=max,scope=chatbox
